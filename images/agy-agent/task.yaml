apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: agy-agent
  atespace: default
spec:
  image: "ghcr.io/ghchinoy/ax-images/agy-agent@sha256:f560d9a64b2863c181efbe681bf3f8472ddb562cddf48487146b591e9e7ffdc7"
  debug: true
  config:
    prompt: "Inspect /workspace, run tests, and fix any issues."
    maxTurns: 25
    # Set safetyGate: true (or provide DGEM_GATEWAY_URL / DGEM_GATE_STATIC=1)
    # to enable the 4-stage cascading DiffusionGemma (dgem) PreToolUse safety gate.
    safetyGate: false
  env:
    - name: GEMINI_API_KEY
      value: "${GEMINI_API_KEY}"
