apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: agy-agent
  atespace: default
spec:
  profile:
    image: "ghcr.io/ghchinoy/ax-images/agy-agent@sha256:bd8792bf378a2ba2d8953934ed3a2b195d8b9c9063a4f58a31f1b5ebea75e47f"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  debug: true
  goal:
    spec: "Inspect /workspace, run tests, and fix any issues."
  config:
    maxTurns: 25
    # Set safetyGate: true (or provide DGEM_GATEWAY_URL / DGEM_GATE_STATIC=1)
    # to enable the 4-stage cascading DiffusionGemma (dgem) PreToolUse safety gate.
    safetyGate: false
  env:
    - name: GEMINI_API_KEY
      value: "${GEMINI_API_KEY}"
