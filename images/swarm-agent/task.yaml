apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: swarm-agent
  atespace: default
spec:
  profile:
    image: "ghcr.io/ghchinoy/ax-images/swarm-agent:latest"
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
  debug: true
  goal:
    spec: "Inspect /workspace and summarize key findings."
  config:
    role: "Security Auditor"
    model: "gemini-3.8-flash"
  env:
    - name: GEMINI_API_KEY
      value: "${GEMINI_API_KEY}"
